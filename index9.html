<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b6fd6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Love Prank" />
    <title>Time Capsule — Opening Soon</title>
    <meta name="description" content="A time-locked message is waiting for you.">
    <meta name="robots" content="noindex, follow">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *:focus { outline: none !important; }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #dceeff 0%, #a8cdfb 55%, #7fa9f2 100%);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 18px 40px;
            min-height: 100vh;
        }

        .top-back {
            position: fixed;
            top: 8px; left: 8px;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.85);
            color: #2a4d8f;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            white-space: nowrap;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.95);
            border-radius: 26px;
            padding: 28px 22px;
            box-shadow: 0 12px 32px rgba(42,77,143,0.22);
            text-align: center;
        }

        .lock-icon { font-size: 3em; margin-bottom: 10px; }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.9em;
            color: #2a4d8f;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85em;
            color: #4a5c7a;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 16px 0 20px;
        }
        .countdown-unit {
            background: #eef5ff;
            border-radius: 14px;
            padding: 12px 4px;
        }
        .countdown-num {
            font-size: 1.5em;
            font-weight: 800;
            color: #2a4d8f;
            font-variant-numeric: tabular-nums;
        }
        .countdown-label {
            font-size: 0.6em;
            font-weight: 700;
            color: #4a5c7a;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .message-box {
            background: #fff8fb;
            border-radius: 16px;
            padding: 20px 18px;
            margin: 18px 0;
            font-size: 0.95em;
            color: #3a2a1a;
            line-height: 1.7;
            white-space: pre-wrap;
            text-align: left;
            border-left: 4px solid #ff5e8e;
        }

        .from-tag {
            font-size: 0.78em;
            color: #7a4560;
            text-align: right;
            margin-top: 10px;
            font-weight: 700;
        }

        .secondary-btn {
            width: 100%;
            margin-top: 10px;
            background: rgba(59,111,214,0.08);
            color: #2a4d8f;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
        }

        .empty-state {
            color: #4a5c7a;
            font-size: 0.9em;
            line-height: 1.6;
        }

        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <a class="top-back" href="index3.html">← Back</a>

    <div class="card" id="card"></div>
    <canvas id="confettiCanvas"></canvas>

    <script>
    const card = document.getElementById('card');

    function decodeData(str) {
        try {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const json = decodeURIComponent(escape(atob(b64)));
            return JSON.parse(json);
        } catch (e) {
            return null;
        }
    }
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    const hash = window.location.hash.slice(1);
    const data = hash ? decodeData(hash) : null;

    if (!data || !data.n || !data.m || !data.u) {
        renderEmptyState();
    } else {
        const unlockTime = new Date(data.u).getTime();
        if (isNaN(unlockTime)) {
            renderEmptyState();
        } else if (Date.now() >= unlockTime) {
            renderMessage(data);
        } else {
            renderCountdown(data, unlockTime);
        }
    }

    function renderEmptyState() {
        card.innerHTML = `
            <div class="lock-icon">🔒</div>
            <div class="title" style="font-size:1.6em;">Capsule Not Found</div>
            <div class="empty-state">
                This link isn't valid, or the capsule data is missing.<br><br>
                Create your own Time Capsule from "Advance Options".
            </div>
            <button class="secondary-btn" onclick="window.location.href='index3.html'">← Go to Advance Options</button>
        `;
    }

    function renderCountdown(data, unlockTime) {
        card.innerHTML = `
            <div class="lock-icon">🔒</div>
            <div class="title">Not Yet...</div>
            <div class="subtitle"><b>${escapeHtml(data.n)}</b> left you a message. It unlocks soon.</div>
            <div class="countdown-grid">
                <div class="countdown-unit"><div class="countdown-num" id="cdDays">00</div><div class="countdown-label">Days</div></div>
                <div class="countdown-unit"><div class="countdown-num" id="cdHours">00</div><div class="countdown-label">Hours</div></div>
                <div class="countdown-unit"><div class="countdown-num" id="cdMins">00</div><div class="countdown-label">Mins</div></div>
                <div class="countdown-unit"><div class="countdown-num" id="cdSecs">00</div><div class="countdown-label">Secs</div></div>
            </div>
            <div class="subtitle" style="margin-bottom:0;">Come back when the timer hits zero 💌</div>
        `;

        const daysEl = document.getElementById('cdDays');
        const hoursEl = document.getElementById('cdHours');
        const minsEl = document.getElementById('cdMins');
        const secsEl = document.getElementById('cdSecs');

        function pad(n) { return String(n).padStart(2, '0'); }

        function tick() {
            const remaining = unlockTime - Date.now();
            if (remaining <= 0) {
                clearInterval(timerId);
                renderMessage(data);
                return;
            }
            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((remaining / (1000 * 60)) % 60);
            const secs = Math.floor((remaining / 1000) % 60);
            daysEl.textContent = pad(days);
            hoursEl.textContent = pad(hours);
            minsEl.textContent = pad(mins);
            secsEl.textContent = pad(secs);
        }

        tick();
        const timerId = setInterval(tick, 1000);
    }

    function renderMessage(data) {
        card.innerHTML = `
            <div class="lock-icon">💌</div>
            <div class="title" style="font-size:1.7em;">It's Time</div>
            <div class="message-box">${escapeHtml(data.m)}<div class="from-tag">— ${escapeHtml(data.n)}</div></div>
            <button class="secondary-btn" onclick="window.location.href='index3.html'">Create Your Own Capsule</button>
        `;
        fireConfetti();
    }

    // Lightweight confetti burst
    function fireConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#ff5e8e', '#c2185b', '#3b6fd6', '#ffd76e', '#ff9838'];
        const pieces = [];
        for (let i = 0; i < 90; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * canvas.height * 0.5,
                w: 6 + Math.random() * 5,
                h: 8 + Math.random() * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: 2 + Math.random() * 3,
                vx: -1.5 + Math.random() * 3,
                rot: Math.random() * 360,
                vr: -6 + Math.random() * 12
            });
        }

        let frame = 0;
        const maxFrames = 220;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.vr;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });
            frame++;
            if (frame < maxFrames) {
                requestAnimationFrame(animate);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
        animate();
    }
    </script>
</body>
</html>
