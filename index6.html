<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c2185b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Love Prank" />
    <title>Someone Left You Something — Love Decoder</title>
    <meta name="description" content="Answer a few questions and see how well your answers match.">
    <meta name="robots" content="noindex, follow">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        *:focus { outline: none !important; }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, #ffe1ec 0%, #ff9fc4 55%, #ff6fa5 100%);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 18px 40px;
            min-height: 100vh;
        }

        .top-back {
            position: fixed;
            top: 8px; left: 8px;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.85);
            color: #c2185b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            white-space: nowrap;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.95);
            border-radius: 26px;
            padding: 26px 22px;
            box-shadow: 0 12px 32px rgba(194,24,91,0.22);
        }

        .mystery-icon { text-align: center; font-size: 3em; margin-bottom: 8px; }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8em;
            color: #c2185b;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.82em;
            color: #7a4560;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .step-nav-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }
        .link-btn {
            background: none;
            border: none;
            color: #c2185b;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8em;
            opacity: 0.75;
            cursor: pointer;
            padding: 6px 4px;
        }
        .link-btn:disabled { opacity: 0.3; cursor: default; }

        /* Progress bar */
        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #ffe1ec;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 22px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff5e8e, #c2185b);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-label {
            font-size: 0.68em;
            color: #7a4560;
            font-weight: 700;
            text-align: right;
            margin-top: 6px;
            margin-bottom: -14px;
        }

        label {
            display: block;
            font-size: 0.82em;
            font-weight: 700;
            color: #4a1230;
            margin: 16px 0 6px;
        }
        label.first { margin-top: 0; }

        input[type="text"], textarea {
            width: 100%;
            border: 2px solid #ffd3e4;
            border-radius: 14px;
            padding: 11px 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9em;
            color: #4a1230;
            background: #fff8fb;
            resize: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, textarea:focus { border-color: #c2185b; }

        .primary-btn {
            width: 100%;
            margin-top: 24px;
            background: linear-gradient(135deg, #ff5e8e, #c2185b);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(194,24,91,0.4);
            transition: transform 0.15s;
        }
        .primary-btn:active { transform: scale(0.97); }

        .empty-state {
            text-align: center;
            color: #7a4560;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .score-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            margin: 14px auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: conic-gradient(#ff5e8e calc(var(--pct) * 1%), #ffe1ec 0);
            position: relative;
            transition: background 1s ease;
        }
        .score-circle::before {
            content: '';
            position: absolute;
            width: 122px; height: 122px;
            background: #fff;
            border-radius: 50%;
        }
        .score-inner { position: relative; z-index: 1; text-align: center; }
        .score-num { font-size: 1.9em; font-weight: 800; color: #c2185b; }
        .score-label { font-size: 0.7em; color: #7a4560; font-weight: 700; }

        .qa-item {
            background: #fff8fb;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.4s ease forwards;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .qa-question-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .qa-question { font-size: 0.78em; font-weight: 700; color: #4a1230; }
        .qa-badge {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.62em;
            font-weight: 800;
            letter-spacing: 0.02em;
            padding: 4px 9px 4px 7px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .qa-badge.is-match {
            background: linear-gradient(135deg, #34d17a, #1f9e5c);
            color: #fff;
            box-shadow: 0 3px 8px rgba(31,158,92,0.35);
        }
        .qa-badge.is-nomatch {
            background: #f1e4ea;
            color: #9c7a8c;
        }
        .qa-badge svg { width: 11px; height: 11px; flex-shrink: 0; }
        .qa-answers { display: flex; gap: 8px; }
        .qa-answer {
            flex: 1;
            font-size: 0.75em;
            color: #7a4560;
            background: #ffe1ec;
            border-radius: 10px;
            padding: 6px 9px;
            line-height: 1.4;
        }
        .qa-answer.match { background: #d7f5df; color: #1f7a3d; }
        .qa-answer-label { font-size: 0.62em; font-weight: 800; opacity: 0.6; display: block; margin-bottom: 2px; }

        .secondary-btn {
            width: 100%;
            margin-top: 10px;
            background: rgba(194,24,91,0.08);
            color: #c2185b;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <a class="top-back" href="index3.html">← Back</a>

    <div class="card" id="card"></div>

    <div class="toast" id="toast"></div>

    <script>
    const QUESTIONS = [
        "When do you miss me the most?",
        "Do you remember our first conversation?",
        "What's your favorite thing about me?",
        "Where would you want our first date to be?",
        "What color are my eyes?",
        "What's my favorite food?"
    ];

    const card = document.getElementById('card');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function encodeData(obj) {
        const json = JSON.stringify(obj);
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function decodeData(str) {
        try {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const json = decodeURIComponent(escape(atob(b64)));
            return JSON.parse(json);
        } catch (e) {
            return null;
        }
    }
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    function normalize(s) {
        return s.toLowerCase().trim().replace(/[.,!?;:'"]/g, '');
    }
    function similar(a, b) {
        const na = normalize(a), nb = normalize(b);
        if (!na || !nb) return false;
        if (na === nb) return true;
        const wordsA = new Set(na.split(' ').filter(w => w.length > 2));
        const wordsB = new Set(nb.split(' ').filter(w => w.length > 2));
        let overlap = 0;
        wordsA.forEach(w => { if (wordsB.has(w)) overlap++; });
        return overlap >= 1;
    }
    function computeMatch(senderAnswers, myAnswers) {
        const pairs = QUESTIONS.map((q, i) => ({
            q,
            a1: senderAnswers[i] || '',
            a2: myAnswers[i] || '',
            match: similar(senderAnswers[i] || '', myAnswers[i] || '')
        }));
        const matchCount = pairs.filter(p => p.match).length;
        const pct = Math.round((matchCount / QUESTIONS.length) * 100);
        return { pairs, pct };
    }
    function verdictFor(pct) {
        if (pct >= 75) return "Wow, you two match really well! 💞";
        if (pct >= 40) return "You match on some things, differ on others 💗";
        return "Different perspectives — but that's interesting too! 💗";
    }

    const hash = window.location.hash.slice(1);
    const incoming = hash ? decodeData(hash) : null;

    if (incoming && incoming.n && Array.isArray(incoming.a) && incoming.a.length > 0) {
        // Pad/trim in case QUESTIONS length ever changes between versions
        while (incoming.a.length < QUESTIONS.length) incoming.a.push('(skipped)');
        if (incoming.a.length > QUESTIONS.length) incoming.a = incoming.a.slice(0, QUESTIONS.length);
        renderAnswerScreen(incoming);
    } else if (!hash) {
        renderEmptyState(false);
    } else {
        // Hash exists but failed to decode — link was corrupted/cut off in transit
        renderEmptyState(true);
    }

    function renderEmptyState(wasCorrupted) {
        card.innerHTML = wasCorrupted ? `
            <div class="title" style="font-size:1.6em;">Link Looks Incomplete</div>
            <div class="empty-state">
                Part of this link seems to be missing or was cut off when it was copied or sent — this can happen with some messaging apps.<br><br>
                Ask the sender to use the "Copy Link" or "Share" button (not manually selecting text), and make sure the full link is pasted, including everything after the <b>#</b> symbol.
            </div>
            <button class="secondary-btn" onclick="window.location.href='index3.html'">← Go to Advance Options</button>
        ` : `
            <div class="title" style="font-size:1.6em;">Link Not Valid</div>
            <div class="empty-state">
                This link isn't valid, or the data is missing.<br><br>
                Start a new Love Decoder from "Advance Options".
            </div>
            <button class="secondary-btn" onclick="window.location.href='index3.html'">← Go to Advance Options</button>
        `;
    }

    let currentQ = 0;
    const myAnswers = new Array(QUESTIONS.length).fill('');
    let senderData = null;

    function renderAnswerScreen(data) {
        senderData = data;
        card.innerHTML = `
            <div class="mystery-icon">💌</div>
            <div class="title">Someone left you something</div>
            <div class="subtitle">Answer a few questions, and see how well you match!</div>

            <div id="qStep"></div>
        `;
        renderQuestionStep();
    }

    function renderQuestionStep() {
        const qStep = document.getElementById('qStep');
        const pct = Math.round(((currentQ) / QUESTIONS.length) * 100);
        const isLast = currentQ === QUESTIONS.length - 1;
        qStep.innerHTML = `
            <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">${currentQ + 1} / ${QUESTIONS.length}</div>
            <label>${escapeHtml(QUESTIONS[currentQ])}</label>
            <textarea id="answerInput" rows="2" maxlength="120" placeholder="Your answer...">${escapeHtml(myAnswers[currentQ])}</textarea>
            <button class="primary-btn" id="nextBtn">${isLast ? 'Reveal Match 💕' : 'Next →'}</button>
            <div class="step-nav-row">
                <button class="link-btn" id="prevBtn" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>
                <button class="link-btn" id="skipBtn">${isLast ? 'Skip & Reveal' : 'Skip →'}</button>
            </div>
        `;

        document.getElementById('nextBtn').addEventListener('click', () => {
            const ansVal = document.getElementById('answerInput').value.trim();
            if (!ansVal) { showToast('Please answer the question'); return; }
            myAnswers[currentQ] = ansVal;

            if (!isLast) {
                currentQ++;
                renderQuestionStep();
            } else {
                finishAnswering();
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentQ === 0) return;
            myAnswers[currentQ] = document.getElementById('answerInput').value.trim();
            currentQ--;
            renderQuestionStep();
        });

        document.getElementById('skipBtn').addEventListener('click', () => {
            myAnswers[currentQ] = document.getElementById('answerInput').value.trim() || '(skipped)';

            if (!isLast) {
                currentQ++;
                renderQuestionStep();
            } else {
                finishAnswering();
            }
        });
    }

    function finishAnswering() {
        renderMatchResult();
    }

    // ---------- Result: shown right here in index6, comparing sender vs my answers ----------
    function renderMatchResult() {
        const { pairs, pct } = computeMatch(senderData.a, myAnswers);
        const verdict = verdictFor(pct);

        card.innerHTML = `
            <div class="title" style="font-size:1.6em;">Match Result 💕</div>
            <div class="subtitle">Here's how your answers compare with <b>${escapeHtml(senderData.n)}</b>'s:</div>

            <div class="score-circle" style="--pct:0" id="scoreCircle">
                <div class="score-inner">
                    <div class="score-num" id="scoreNum">0%</div>
                    <div class="score-label">MATCH</div>
                </div>
            </div>
            <div class="subtitle">${verdict}</div>

            <div id="qaWrap" style="margin-top:14px;"></div>

            <button class="secondary-btn" id="shareResultBtn">📤 Share Result</button>
            <button class="secondary-btn" id="restartBtn">🔄 Start New</button>
        `;

        // Animate the score circle counting up
        const circle = document.getElementById('scoreCircle');
        const numEl = document.getElementById('scoreNum');
        let current = 0;
        const step = () => {
            current += 2;
            if (current >= pct) current = pct;
            circle.style.setProperty('--pct', current);
            numEl.textContent = current + '%';
            if (current < pct) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);

        const qaWrap = document.getElementById('qaWrap');
        pairs.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'qa-item';
            div.style.animationDelay = (i * 0.12) + 's';
            div.innerHTML = `
                <div class="qa-question-row">
                    <div class="qa-question">${escapeHtml(p.q)}</div>
                    <span class="qa-badge ${p.match ? 'is-match' : 'is-nomatch'}">
                        ${p.match
                            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Match'
                            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> No match'}
                    </span>
                </div>
                <div class="qa-answers">
                    <div class="qa-answer ${p.match ? 'match' : ''}">
                        <span class="qa-answer-label">${escapeHtml(senderData.n)}</span>${escapeHtml(p.a1)}
                    </div>
                    <div class="qa-answer ${p.match ? 'match' : ''}">
                        <span class="qa-answer-label">You</span>${escapeHtml(p.a2)}
                    </div>
                </div>
            `;
            qaWrap.appendChild(div);
        });

        document.getElementById('shareResultBtn').addEventListener('click', () => {
            const text = `${senderData.n} & You — ${pct}% Love Match! 💕`;
            if (navigator.share) {
                navigator.share({ title: 'Love Decoder Result', text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => showToast('Result copied!'));
            }
        });
        document.getElementById('restartBtn').addEventListener('click', () => {
            window.location.href = 'index3.html';
        });
    }
    </script>
</body>
</html>
