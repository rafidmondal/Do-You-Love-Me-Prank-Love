<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c2185b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Love Prank" />
    <title>For You 💗</title>
    <meta name="description" content="A little love experience made just for you.">
    <meta name="robots" content="noindex, follow">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        *:focus { outline: none !important; box-shadow: none !important; }

        html, body {
            width: 100%; min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(160deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
            overflow-x: hidden;
            color: var(--dark);
        }
        body { display: flex; flex-direction: column; align-items: center; padding: 46px 18px 60px; position: relative; }

        .hearts-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .floaty-heart { position: absolute; bottom: -40px; font-size: 18px; opacity: 0.4; animation: floatUp linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0.5; } 100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; } }

        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.35; pointer-events: none; z-index: 0;
        }
        .orb1 { width: 260px; height: 260px; background: var(--c4); top: -60px; left: -60px; }
        .orb2 { width: 220px; height: 220px; background: var(--c5); bottom: -40px; right: -40px; }

        .hero { text-align: center; margin-bottom: 24px; position: relative; z-index: 2; }
        .hero .sparkle-row { font-size: 1.1em; margin-bottom: 6px; opacity: 0.8; letter-spacing: 6px; }
        .hero h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2em, 9vw, 2.7em);
            background: linear-gradient(120deg, var(--c4), var(--c5));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1.15;
        }
        .hero p { font-size: 0.85em; color: var(--dark); opacity: 0.7; margin-top: 6px; }

        .wrap { max-width: 420px; width: 100%; position: relative; z-index: 2; }

        .glass-card {
            background: rgba(255,255,255,0.92);
            border-radius: 26px;
            padding: 24px 22px;
            margin-bottom: 20px;
            box-shadow: 0 14px 36px rgba(0,0,0,0.10), 0 1px 0 rgba(255,255,255,0.5) inset;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .section-title {
            display: flex; align-items: center; gap: 9px;
            font-weight: 800; font-size: 1.06em; color: var(--dark); margin-bottom: 14px;
        }
        .section-title .emoji {
            width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1.15em;
            background: linear-gradient(135deg, var(--c4), var(--c5)); color: #fff;
        }

        /* Time capsule */
        .capsule-locked { text-align: center; padding: 8px 4px 4px; }
        .capsule-icon { font-size: 2.3em; margin-bottom: 10px; opacity: 0.9; }
        .countdown {
            font-size: 1.15em; font-weight: 800; margin: 10px 0 4px; letter-spacing: 0.3px;
            color: var(--c4);
        }
        .countdown-label { font-size: 0.72em; opacity: 0.6; margin-bottom: 4px; }
        .capsule-note {
            display: none; background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
            border-radius: 18px; padding: 20px; text-align: center;
            font-family: 'Dancing Script', cursive; font-size: 1.35em; line-height: 1.5; color: var(--dark);
            border: 1px solid rgba(255,255,255,0.7);
        }
        .capsule-note.revealed { display: block; animation: revealFade 0.6s ease; }
        @keyframes revealFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .unlock-btn {
            margin-top: 14px; padding: 11px 26px; border: none; border-radius: 50px;
            background: linear-gradient(135deg, var(--c4), var(--c5)); color: #fff;
            font-weight: 800; cursor: pointer; font-size: 0.85em; box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        /* Decoder */
        .decoder-hint {
            font-size: 0.95em; margin-bottom: 14px; color: var(--dark); font-style: italic;
            background: rgba(0,0,0,0.04); padding: 12px 14px; border-radius: 14px; line-height: 1.5;
        }
        input.decoder-input {
            width: 100%; border: 2px solid rgba(0,0,0,0.08); border-radius: 14px;
            padding: 12px 14px; font-family: 'Nunito', sans-serif; font-size: 0.9em; margin-bottom: 12px;
            background: #fff; color: var(--dark);
        }
        input.decoder-input:focus { border-color: var(--c4); }
        .decoder-submit {
            width: 100%; padding: 13px; border: none; border-radius: 50px; font-weight: 800; cursor: pointer;
            background: linear-gradient(135deg, var(--c4), var(--c5)); color: #fff; font-size: 0.92em;
            box-shadow: 0 6px 16px rgba(0,0,0,0.14);
        }
        .decoder-feedback { margin-top: 10px; font-size: 0.85em; text-align: center; min-height: 18px; font-weight: 700; }
        .decoder-reveal {
            display: none; margin-top: 14px; background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.25));
            border-radius: 16px; padding: 16px; text-align: center;
            font-family: 'Dancing Script', cursive; font-size: 1.3em; border: 1px solid rgba(255,255,255,0.7);
        }
        .decoder-reveal.show { display: block; animation: revealFade 0.6s ease; }

        /* Miss box */
        .miss-quote {
            text-align: center; font-family: 'Dancing Script', cursive; font-size: 1.35em; line-height: 1.5;
            padding: 6px 4px;
        }

        .footer-note {
            text-align: center; font-size: 0.72em; opacity: 0.55; margin-top: 8px; position: relative; z-index: 2;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="hero">
        <div class="sparkle-row">✦ ✧ ✦</div>
        <h1>Made For You</h1>
        <p>Someone put a little love into this 💗</p>
    </div>

    <div class="wrap">
        <div class="glass-card" id="capsuleCard" style="display:none;">
            <div class="section-title"><span class="emoji">⏳</span> Time Capsule</div>
            <div class="capsule-locked" id="capsuleLocked">
                <div class="capsule-icon">🔒</div>
                <div class="countdown-label">Unlocks in</div>
                <div class="countdown" id="countdownText">--</div>
            </div>
            <div class="capsule-note" id="capsuleNote"></div>
        </div>

        <div class="glass-card" id="decoderCard" style="display:none;">
            <div class="section-title"><span class="emoji">🔐</span> Two-Way Love Decoder</div>
            <div class="decoder-hint" id="decoderHintText"></div>
            <input type="text" class="decoder-input" id="decoderInput" placeholder="Type your answer...">
            <button class="decoder-submit" id="decoderSubmit">Unlock 💗</button>
            <div class="decoder-feedback" id="decoderFeedback"></div>
            <div class="decoder-reveal" id="decoderRevealBox"></div>
        </div>

        <div class="glass-card" id="missCard" style="display:none;">
            <div class="section-title"><span class="emoji">💭</span> When I Miss You Most</div>
            <div class="miss-quote" id="missQuoteText"></div>
        </div>
    </div>

    <div class="footer-note">Made with 💗 — Do You Love Me?</div>

    <script>
    const params = new URLSearchParams(window.location.search);

    const THEME_COLORS = {
        pink:    { c1:'#ffe1ec', c2:'#ff9fc4', c3:'#ff6fa5', c4:'#c2185b', c5:'#ff7ab5', dark:'#4a1230' },
        gold:    { c1:'#fff3d6', c2:'#ffd76a', c3:'#f0b429', c4:'#a8720a', c5:'#ffcf5c', dark:'#4a3200' },
        emerald: { c1:'#d9fbe8', c2:'#5be3a6', c3:'#0e8a5f', c4:'#0e6b4a', c5:'#3fd28c', dark:'#0a3d2a' },
        ruby:    { c1:'#ffdde0', c2:'#ff6b6b', c3:'#a30f26', c4:'#8a0f22', c5:'#ff5c6c', dark:'#4a0812' },
        sunset:  { c1:'#ffe8d6', c2:'#ff9a5a', c3:'#d9480f', c4:'#a33d0a', c5:'#ff9a5a', dark:'#4a2007' },
        ocean:   { c1:'#d9f1ff', c2:'#5ac8ff', c3:'#1258a8', c4:'#154f8a', c5:'#5ac8ff', dark:'#0a2a4a' }
    };
    const themeKey = params.get('theme') || 'pink';
    const t = THEME_COLORS[themeKey] || THEME_COLORS.pink;
    const root = document.documentElement.style;
    root.setProperty('--c1', t.c1);
    root.setProperty('--c2', t.c2);
    root.setProperty('--c3', t.c3);
    root.setProperty('--c4', t.c4);
    root.setProperty('--c5', t.c5);
    root.setProperty('--dark', t.dark);

    // Floating hearts
    const heartsBg = document.getElementById('heartsBg');
    const heartEmojis = ['💗','💕','🩷','❤️'];
    function spawnHeart() {
        const h = document.createElement('div');
        h.className = 'floaty-heart';
        h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
        h.style.left = Math.random()*100 + 'vw';
        h.style.animationDuration = (5 + Math.random()*3) + 's';
        heartsBg.appendChild(h);
        setTimeout(() => h.remove(), 8500);
    }
    setInterval(spawnHeart, 1300);

    /* ---------- MUSIC: plays silently in background, no controls, no way to stop ---------- */
    const music = params.get('music') || 'm1';
    function startBackgroundAudio() {
        if (music === 'youtube') {
            const yturl = params.get('yturl') || '';
            const m = yturl.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
            const vid = m ? m[1] : null;
            if (vid) {
                const iframe = document.createElement('iframe');
                iframe.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;right:0;border:0;';
                iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&controls=0&loop=1&playlist=${vid}`;
                iframe.allow = 'autoplay';
                document.body.appendChild(iframe);
            }
        } else {
            const track = ['m1','m2','m3'].includes(music) ? music : 'm1';
            const audio = new Audio('assets/' + track + '.mp3');
            audio.loop = true;
            audio.volume = 0.85;
            const tryPlay = () => audio.play().catch(() => {});
            tryPlay();
            // Browsers may block autoplay until first interaction — start on first tap/scroll silently
            const unlock = () => { tryPlay(); document.removeEventListener('click', unlock); document.removeEventListener('touchstart', unlock); document.removeEventListener('scroll', unlock); };
            document.addEventListener('click', unlock, {once:true});
            document.addEventListener('touchstart', unlock, {once:true});
            document.addEventListener('scroll', unlock, {once:true});
        }
    }
    startBackgroundAudio();

    /* ---------- TIME CAPSULE ---------- */
    const capsuleMsg = params.get('capsuleMsg') || '';
    const capsuleTime = params.get('capsuleTime') || '';
    if (capsuleMsg) {
        document.getElementById('capsuleCard').style.display = 'block';
        const note = document.getElementById('capsuleNote');
        note.textContent = capsuleMsg;
        const countdownText = document.getElementById('countdownText');
        const lockedBox = document.getElementById('capsuleLocked');

        let targetTime = capsuleTime ? new Date(capsuleTime).getTime() : null;

        function checkUnlock() {
            if (!targetTime || Date.now() >= targetTime) {
                lockedBox.style.display = 'none';
                note.classList.add('revealed');
                return true;
            }
            const diff = targetTime - Date.now();
            const d = Math.floor(diff/86400000);
            const h = Math.floor((diff%86400000)/3600000);
            const m = Math.floor((diff%3600000)/60000);
            const s = Math.floor((diff%60000)/1000);
            countdownText.textContent = `${d}d ${h}h ${m}m ${s}s`;
            return false;
        }

        if (!targetTime) {
            lockedBox.innerHTML = '<div class="capsule-icon">💌</div><button class="unlock-btn" id="manualUnlock">Unlock Now</button>';
            document.getElementById('manualUnlock').addEventListener('click', () => {
                lockedBox.style.display = 'none';
                note.classList.add('revealed');
            });
        } else {
            if (!checkUnlock()) {
                const iv = setInterval(() => { if (checkUnlock()) clearInterval(iv); }, 1000);
            }
        }
    }

    /* ---------- DECODER ---------- */
    const decoderHint = params.get('decoderHint') || '';
    const decoderAnswer = (params.get('decoderAnswer') || '').trim().toLowerCase();
    const decoderReveal = params.get('decoderReveal') || '';
    if (decoderHint && decoderAnswer) {
        document.getElementById('decoderCard').style.display = 'block';
        document.getElementById('decoderHintText').textContent = '"' + decoderHint + '"';
        const input = document.getElementById('decoderInput');
        const feedback = document.getElementById('decoderFeedback');
        const revealBox = document.getElementById('decoderRevealBox');

        document.getElementById('decoderSubmit').addEventListener('click', () => {
            const guess = input.value.trim().toLowerCase();
            if (guess === decoderAnswer) {
                feedback.textContent = '✓ Correct!';
                feedback.style.color = '#0e8a5f';
                revealBox.textContent = decoderReveal || 'You figured it out 💗';
                revealBox.classList.add('show');
            } else {
                feedback.textContent = 'Not quite — try again';
                feedback.style.color = '#c2172f';
            }
        });
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('decoderSubmit').click(); });
    }

    /* ---------- MISS BOX ---------- */
    const missBox = params.get('missBox') || '';
    if (missBox) {
        document.getElementById('missCard').style.display = 'block';
        document.getElementById('missQuoteText').textContent = missBox;
    }
    </script>
</body>
</html>
