<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Do You Love Me?</title>
    <meta name="description" content="This page was not found. Please check the URL and go back to the Do You Love Me? home page." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#c2185b" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{
        font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        background:linear-gradient(135deg,#ff75aa 0%,#fda1d4 50%,#ffe3f1 100%);
        color:#5a0a2e;overflow-x:hidden;-webkit-font-smoothing:antialiased
      }
      .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
      .hearts span{position:absolute;bottom:-40px;opacity:.55;animation:rise linear infinite}
      @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
      main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px}
      .heart{font-size:clamp(72px,16vw,130px);line-height:1;animation:dance 1.6s ease-in-out infinite;display:inline-block}
      @keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-14px) rotate(8deg) scale(1.1)}}
      .code{font-size:clamp(64px,18vw,140px);font-weight:900;line-height:1;margin:6px 0 0;color:#fff;text-shadow:0 6px 24px rgba(194,24,91,.45)}
      h1{font-size:clamp(24px,5.5vw,40px);margin:8px 0 10px;color:#7a0b3d}
      .msg{font-size:clamp(17px,3.6vw,22px);font-weight:700;margin:0 0 6px}
      .url{display:inline-block;max-width:92vw;margin:8px 0 0;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.55);font:600 14px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:#a0114f}
      .home{display:inline-block;margin:26px 0 10px;padding:20px 48px;border-radius:999px;background:linear-gradient(135deg,#f02580,#ff6eb5);color:#fff;font-size:clamp(20px,4.6vw,30px);font-weight:900;text-decoration:none;box-shadow:0 12px 32px rgba(240,37,128,.45);transition:transform .15s}
      .home:hover,.home:focus{transform:scale(1.05)}
      .home:active{transform:scale(.97)}
      .auto{margin:4px 0 0;font-size:15px;font-weight:700;color:#8a1048}
      .auto a{color:#c2185b}
      .help{margin:34px 0 0;font-size:15px;color:#7a0b3d}
      .help a{color:#c2185b;font-weight:800;word-break:break-all}
      @media (prefers-reduced-motion:reduce){.heart,.hearts span{animation:none}}
    </style>
  </head>
  <body>
    <div class="hearts" aria-hidden="true" id="hearts"></div>
    <main>
      <div class="heart" aria-hidden="true">💖</div>
      <p class="code">404</p>
      <h1>Oops! This page was not found</h1>
      <p class="msg">Please check the URL. It may have a small typo or a wrong link.</p>
      <span class="url" id="wrongUrl"></span>
      <a class="home" href="/">💝 Go to Home Page</a>
      <p class="auto" id="auto">Taking you home in <b id="sec">10</b> seconds… <a href="#" id="stay">Stay here</a></p>
      <p class="help">Need help? Developer support: <a href="mailto:radidmondal@gmail.com">radidmondal@gmail.com</a></p>
    </main>
    <script>
      (function () {
        // Show the wrong address the visitor typed
        try { document.getElementById('wrongUrl').textContent = location.pathname + location.search; } catch (e) {}

        // Floating hearts
        var box = document.getElementById('hearts');
        var icons = ['💗', '💖', '💕', '💝', '❤️'];
        for (var i = 0; i < 16; i++) {
          var s = document.createElement('span');
          s.textContent = icons[i % icons.length];
          s.style.left = Math.round(Math.random() * 96) + '%';
          s.style.fontSize = (16 + Math.round(Math.random() * 26)) + 'px';
          s.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
          s.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
          box.appendChild(s);
        }

        // Auto go to home page (visitor can stop it)
        var left = 10, timer;
        var secEl = document.getElementById('sec');
        function stop() {
          clearInterval(timer);
          document.getElementById('auto').style.display = 'none';
        }
        document.getElementById('stay').addEventListener('click', function (e) { e.preventDefault(); stop(); });
        timer = setInterval(function () {
          left--;
          secEl.textContent = left;
          if (left <= 0) { clearInterval(timer); location.replace('/'); }
        }, 1000);
      })();
    </script>
  </body>
</html>
